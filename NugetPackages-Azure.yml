# Pipeline de build + tests + packaging NuGet

trigger:
 branches:
  include:
    - main
    - v2.*
 paths:
  include:
    - src

variables:
  buildConfiguration: 'Release'

pool:
  vmImage: windows-latest

steps:
- checkout: self
  fetchDepth: 0

# Garantit des SDK compatibles avec les TFM ciblés (net8.0 / net10.0) et le format .slnx
# (compris à partir du SDK 9.0.200). net462 se construit via les reference assemblies.
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: sdk
    version: '8.0.x'
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: sdk
    version: '10.0.x'
    includePreviewVersions: true

- script: dotnet build XrmFramework.slnx --configuration $(buildConfiguration) /p:PublicRelease=true
  displayName: Build
  workingDirectory: src

# command: 'test' publie automatiquement les résultats (.trx / VSTest) via publishTestResults.
# dotnet test produit du .trx, PAS du NUnit TEST-*.xml — d'où l'absence de la tâche
# PublishTestResults@2 (qui cherchait à tort des **/TEST-*.xml en format NUnit).
- task: DotNetCoreCLI@2
  displayName: Test
  inputs:
    command: 'test'
    projects: 'src/XrmFramework.slnx'
    arguments: '--configuration $(buildConfiguration) --logger trx --collect "Code coverage"'
    publishTestResults: true

- task: CopyFiles@2
  inputs:
    SourceFolder: 'src/GeneratedNuGetPackages/$(buildConfiguration)/'
    Contents: '**'
    TargetFolder: '$(build.artifactstagingdirectory)'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(build.artifactstagingdirectory)'
    artifact: 'Packages'
    publishLocation: 'pipeline'
