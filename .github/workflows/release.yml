# Publishes to nuget.org the packages produced by a Build & Tests run.
#
# Deliberately NOT automatic: the workflow is started by hand and is gated by the
# `nuget` environment, so a reviewer approves before anything is pushed. It never
# rebuilds — it republishes the exact artifacts of a green CI run, so what reaches
# nuget.org is byte-for-byte what was tested.
#
# Authentication goes through nuget.org Trusted Publishing: no API key is stored
# anywhere. GitHub issues an OIDC token to this job, NuGet/login exchanges it against
# the trusted publishing policy and returns a temporary key valid about an hour.
#
# Required one-time setup (see .github/CI-MIGRATION.md):
#   - a Trusted Publishing policy on nuget.org whose Workflow file is `release.yml`
#     and whose Environment is either empty or exactly `nuget`, this job running in
#     that environment;
#   - a NUGET_USER repository variable (Settings → Variables), holding the nuget.org
#     account name that owns the policy. A variable and not a secret: it is not
#     sensitive, and a wrong value must produce a readable error.
#   - the `nuget` environment with "Required reviewers" enabled. The environment no
#     longer carries a secret, it carries the approval gate — that is its only job now.

name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build & Tests run id whose Packages artifact to publish (empty = latest successful run on this branch)'
        required: false
        type: string
      dry_run:
        description: 'List the packages without pushing them'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read # to download the artifacts of another workflow run
  id-token: write # required for GitHub to issue the OIDC token NuGet/login exchanges

concurrency:
  group: release-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest # no build here, only dotnet nuget push
    environment: nuget
    timeout-minutes: 20

    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the CI run to publish
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN_ID" ]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch "$GITHUB_REF_NAME" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful Build & Tests run found for $GITHUB_REF_NAME"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json displayTitle,headBranch,headSha,conclusion \
            --jq '"Publishing artifacts of run \(.displayTitle) — \(.headBranch)@\(.headSha[0:8]) (\(.conclusion))"'

      - name: Download the Packages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.resolve.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name Packages \
            --dir packages

      - name: List the packages
        run: |
          set -euo pipefail
          ls -l packages
          count=$(find packages -name '*.nupkg' | wc -l)
          echo "### Packages to publish ($count)" >> "$GITHUB_STEP_SUMMARY"
          find packages -name '*.nupkg' -printf '- %f\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            echo "::error::No .nupkg in the artifact"
            exit 1
          fi

      # Checked before the login rather than after: NuGet/login fails on an empty user
      # with an error that says nothing about the missing variable.
      - name: Check the publishing configuration
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::The NUGET_USER repository variable is not set. It must hold the nuget.org account that owns the trusted publishing policy."
            exit 1
          fi
          echo "Publishing as nuget.org user $NUGET_USER."

      # Exchanges the job's OIDC token for a short-lived nuget.org key. Skipped on a dry
      # run: no reason to mint a credential for a publish that will not happen.
      - name: Log in to nuget.org
        id: login
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The .snupkg files sit next to the .nupkg: dotnet nuget push uploads the
      # matching symbol package automatically, no second push needed.
      # --skip-duplicate makes a re-run idempotent instead of failing on a version
      # already published.
      - name: Push to nuget.org
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run — nothing was pushed. Re-run with dry_run = false to publish."
